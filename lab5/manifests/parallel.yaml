apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-parallel
  namespace: lab5
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 2
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: calculate
          image: de-lab5:local
          imagePullPolicy: Never
          args: ["--prefix", "lab5/parallel"]
          resources:
            requests: {cpu: "500m", memory: "128Mi"}
            limits: {cpu: "1000m", memory: "176Mi"}
          envFrom:
            - secretRef: {name: lab5-s3}
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: LAB5_S3_ENDPOINT
              value: http://rustfs.lab5.svc.cluster.local:9000
