apiVersion: v1
kind: Namespace
metadata:
  name: lab5
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: lab5-storage
value: 100000
globalDefault: false
preemptionPolicy: Never
description: Keep the S3 storage above the priorities used in lab5 scheduling tests.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: lab5
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: lab5
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: lab5-rustfs}
  template:
    metadata:
      labels: {app: lab5-rustfs}
    spec:
      priorityClassName: lab5-storage
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          # Official tag 1.0.1, digest checked against Docker Hub on 2026-11-18.
          image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          args: ["/data"]
          ports:
            - {name: s3, containerPort: 9000}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: lab5-s3, key: LAB5_S3_ACCESS_KEY}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: lab5-s3, key: LAB5_S3_SECRET_KEY}
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "false"}
            - {name: RUSTFS_OBS_LOGGER_LEVEL, value: "error"}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1000m", memory: "768Mi"}
          readinessProbe:
            tcpSocket: {port: s3}
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rustfs-data}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: lab5
spec:
  selector: {app: lab5-rustfs}
  ports:
    - {name: s3, port: 9000, targetPort: s3}
